[package]
name = "tada"
version = "0.3.0"
authors = [ "Patrick Marks <patrick@10xgenomics.com>" ]
build = "build.rs"

[dependencies]
byteorder = "1"
flate2 = "1"
docopt = "1"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
linked-hash-map = "0.5"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
time = "0.3"
chrono = "0.4"
itertools = "0.10"
log = "0.4"
env_logger = "0.10"
csv = "1"
crossbeam = "0.8"
rayon = "1"
libc = "0.2"
bit-set = "0.5"
tempfile = "3"
nix = "0.26"
backtrace = "0.3"
lz4 = "1"
smallvec = "1"
shardio = { path = "external/rust-shardio" }
martian = { path = "external/martian" }
fastq_10x = { path = "external/rust-fastq-10x" }
rustc_version_runtime = "0.3"

[dev-dependencies]
quickcheck = "1"

[profile.release]
opt-level = 3
debug = true

[lib]
name = "tada"
path = "src/lib.rs"

[[bin]]
name = "tada"
doc = false
